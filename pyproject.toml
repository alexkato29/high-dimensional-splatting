[project]
name = "gaussian_splatting"
version = "0.1.0"
description = "Minimal implementation of 3DGS"
authors = [
    {name = "Alex Katopodis"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch ~=2.10.0",
    "pycolmap ~=3.13.0",
    "pillow ~= 12.1.0",
    "scipy ~= 1.17.0",
    "ninja ~= 1.11.1"
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest ~=8.3.0",
]
bench = [
    "gsplat; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
gsplat = { git = "https://github.com/nerfstudio-project/gsplat", rev = "28e794ca44a4c25ffc39175370c5ee7b38bfcc36" }

[tool.uv]
no-build-isolation-package = ["gsplat"]

[[tool.uv.dependency-metadata]]
name = "gsplat"
version = "1.6.0"
requires-dist = ["ninja", "numpy", "jaxtyping", "nvtx", "rich>=12", "torch>=2.7"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
