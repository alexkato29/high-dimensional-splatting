[project]
name = "gaussian_splatting"
version = "0.1.0"
description = "Minimal implementation of 3DGS"
authors = [
    {name = "Alex Katopodis"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch ~=2.10.0",
    "pycolmap ~=3.13.0",
    "pillow ~= 12.1.0",
    "scipy ~= 1.17.0",
    "ninja ~= 1.11.1"
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest ~=8.3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
